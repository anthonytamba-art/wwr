    <meta charset="UTF-8">

    <title>Tamba White Water Rafting | Contact</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="Tamba Rafting Logo" width="100">
        <h1>Tamba White Water Rafting</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Contact Tamba White Water Rafting</h2>
        <p>We would love to hear from you. Contact us to plan your next adventure!</p>

        <h3>Send Us a Message</h3>
        <form>
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Your Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Tamba White Water Rafting | Anthony Tamba</p>
    </footer>
